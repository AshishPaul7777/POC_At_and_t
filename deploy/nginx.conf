# Serve the SPA, proxy the API, and do not buffer the event streams.
#
# The buffering rules below are the load-bearing part of this file. Both the
# pipeline progress feed and the assistant's replies are Server-Sent Events. A
# default nginx buffers proxied responses, so those streams arrive in one lump
# when the run finishes -- the UI looks frozen for eight minutes and then
# blinks to "done". It is not a crash, nothing logs an error, and it is
# extremely easy to ship.

upstream api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Reports are xlsx/json/xml downloads; the SPA bundle compresses well.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves browsers pinned to a bundle that no longer exists.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Server-Sent Events -------------------------------------------------
    # Matched before the general /api rule so the streaming settings win.
    location ~ ^/api/(runs/[^/]+/events|chat/threads/[^/]+/stream)$ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Connection must be cleared, not "upgrade": SSE is a plain long-lived
        # HTTP response, and keep-alive to the upstream would let nginx hold it.
        proxy_set_header Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        # A run can sit quiet between stages for minutes. The app sends a
        # heartbeat every 15s, but this is the backstop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Retrieve and the delete rehearsal are minutes-long synchronous calls.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
        access_log off;
    }
}
