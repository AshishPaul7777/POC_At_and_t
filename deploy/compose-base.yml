# Shared service definitions. NOT a runnable stack on its own.
#
# Two files extend these: docker-compose.prod.yml, which also brings up its own
# Postgres, and docker-compose.external-db.yml, which points at a database that
# already exists on the host. Everything they have in common lives here so the
# build arguments, environment and volumes cannot drift apart.
#
# What is deliberately absent: `depends_on`. Compose carries depends_on across
# `extends`, so a dependency declared here would follow into the external-db
# stack and make it wait for a postgres service that file does not define.
# Each stack declares its own.
name: sfc-base

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: [../.env]
    environment:
      # Container-internal wiring. These override whatever .env carries for a
      # developer machine, so the same .env works in both places. The database
      # half is set by whichever stack extends this.
      REDIS_URL: redis://redis:6379/0
      # Must be absolute and inside the mounted volume. A relative path would
      # resolve against the repo root and land on the container filesystem,
      # where a redeploy would silently discard the retrieved metadata.
      WORKSPACE_DIR: /app/.cache/workspace
      SF_CLI_PATH: sf
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    ports:
      # The API on the host, for curl, /docs and anything driving it directly.
      # The browser still reaches it through nginx on HTTP_PORT, same-origin,
      # so this is an addition rather than the path the UI uses.
      - "${API_BIND:-0.0.0.0}:${API_PORT_PUBLISHED:-8000}:8000"
    volumes:
      # Retrieved metadata and generated reports. Named, not a bind mount:
      # the retrieve pulls hundreds of small files and bind mounts are slow.
      - workspace:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      # The first boot applies the schema and every migration before uvicorn
      # binds, so give it room before the healthcheck starts judging.
      start_period: 90s

  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  redisdata:
  workspace:
