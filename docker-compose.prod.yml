# Production stack for a single Linux VM: database included.
#
# If the VM already runs a Postgres you want to share, use
# docker-compose.external-db.yml instead. Service definitions common to both
# live in deploy/compose-base.yml.
#
# Differences from the development compose file, and why:
#
#   * Published ports: nginx on HTTP_PORT (80), the API on
#     API_PORT_PUBLISHED (8000), and Postgres on DB_PORT_PUBLISHED (5432)
#     bound to 127.0.0.1. Redis stays unpublished -- nothing outside the
#     stack has a reason to reach it.
#   * The backend still reaches Postgres as `postgres:5432` over the compose
#     network. The published port is for your tooling; changing or removing it
#     does not affect how the application talks to its database.
#   * The backend applies the schema and every migration on boot. The dev file
#     mounts schema.sql into Postgres's init directory, which fires once on an
#     empty volume and never applies the migrations -- the most common cause of
#     a broken first start.
#   * The browser reaches the API through nginx, same-origin, so CORS never
#     enters the picture even though the API is also published directly.
name: sfc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sfcleanup}
      # Deterministic collation so ORDER BY on API names is stable across hosts.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sfcleanup}"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      # Bound to loopback by default, which is what makes this safe to leave
      # on: psql from an SSH session works, nothing off the box can reach it.
      #
      # Do not widen this with a firewall rule as the safety net -- on Ubuntu,
      # a published Docker port BYPASSES ufw, because Docker's DNAT rules run
      # before ufw's filtering. "ufw deny 5432" looks like protection and is
      # not. If you genuinely need the database from another host, set
      # DB_BIND to that interface and restrict it in the cloud security group.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT_PUBLISHED:-5432}:5432"


  redis:
    extends:
      file: deploy/compose-base.yml
      service: redis

  backend:
    extends:
      file: deploy/compose-base.yml
      service: backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sfcleanup}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  web:
    extends:
      file: deploy/compose-base.yml
      service: web
    depends_on:
      backend: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  workspace:
