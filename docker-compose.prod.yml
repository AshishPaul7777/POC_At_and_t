# Production stack for a single Linux VM: database included.
#
# If the VM already runs a Postgres you want to share, use
# docker-compose.external-db.yml instead. Service definitions common to both
# live in deploy/compose-base.yml.
#
# Differences from the development compose file, and why:
#
#   * Postgres and Redis are NOT published to the host. In development the
#     ports are shifted to 5433/6380 so they can coexist with a local install;
#     on a VM, exposing a database to the internet is the mistake to avoid, so
#     they are reachable only on the compose network.
#   * The backend applies the schema and every migration on boot. The dev file
#     mounts schema.sql into Postgres's init directory, which fires once on an
#     empty volume and never applies the migrations -- the most common cause of
#     a broken first start.
#   * Only nginx is published. It serves the SPA and proxies /api, so the
#     browser sees one origin and CORS never enters the picture.
name: sfc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sfcleanup}
      # Deterministic collation so ORDER BY on API names is stable across hosts.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sfcleanup}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No ports: the database is reachable only from the compose network.

  redis:
    extends:
      file: deploy/compose-base.yml
      service: redis

  backend:
    extends:
      file: deploy/compose-base.yml
      service: backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sfcleanup}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  web:
    extends:
      file: deploy/compose-base.yml
      service: web
    depends_on:
      backend: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  workspace:
