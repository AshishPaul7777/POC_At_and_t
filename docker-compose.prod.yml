# Production stack for a single Linux VM.
#
# Differences from the development compose file, and why:
#
#   * Postgres and Redis are NOT published to the host. In development the
#     ports are shifted to 5433/6380 so they can coexist with a local install;
#     on a VM, exposing a database to the internet is the mistake to avoid, so
#     they are reachable only on the compose network.
#   * The backend applies the schema and every migration on boot. The dev file
#     mounts schema.sql into Postgres's init directory, which fires once on an
#     empty volume and never applies the migrations -- the most common cause of
#     a broken first start.
#   * Only nginx is published. It serves the SPA and proxies /api, so the
#     browser sees one origin and CORS never enters the picture.
name: sfc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sfcleanup}
      # Deterministic collation so ORDER BY on API names is stable across hosts.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sfcleanup}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No ports: the database is reachable only from the compose network.

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Container-internal wiring. These override whatever .env carries for a
      # developer machine, so the same .env works in both places.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sfcleanup}
      REDIS_URL: redis://redis:6379/0
      # Must be absolute and inside the mounted volume. A relative path would
      # resolve against the repo root and land on the container filesystem,
      # where a redeploy would silently discard the retrieved metadata.
      WORKSPACE_DIR: /app/.cache/workspace
      SF_CLI_PATH: sf
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    volumes:
      # Retrieved metadata and generated reports. Named, not a bind mount:
      # the retrieve pulls hundreds of small files and bind mounts are slow.
      - workspace:/app/.cache
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      # The first boot applies the schema and four migrations before uvicorn
      # binds, so give it room before the healthcheck starts judging.
      start_period: 90s

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  workspace:
