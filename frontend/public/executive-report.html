document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 {\"fontWeight\": 400}}]}, {\"runs\": [{\"text\": \"Why:\", \"bold\": true, \"italic\": false, \"style\": {\"fontWeight\": 700}}, {\"text\": \" Prevents future configuration work from being blocked outright by a hard platform ceiling, and reduces regression risk on every change.\", \"bold\": false, \"italic\": false, \"style\": {\"fontWeight\": 400}}]}]}, {\"title\": \"License Utilization & User Lifecycle\", \"bullets\": [{\"runs\": [{\"text\": \"Today:\", \"bold\": true, \"italic\": false, \"style\": {\"fontWeight\": 700}}, {\"text\": \" Core license pool at 98.6% utilized; 381 deactivated users (51.4%) still hold a license\", \"bold\": false, \"italic\": false, \"style\": {\"fontWeight\": 400}}]}, {\"runs\": [{\"text\": \"Target:\", \"bold\": true, \"italic\": false, \"style\": {\"fontWeight\": 700}}, {\"text\": \" Deactivated users' licenses reclaimed; core license utilization brought back to a healthy working margin\", \"bold\": false, \"italic\": false, \"style\": {\"fontWeight\": 400}}]}, {\"runs\": [{\"text\": \"Why:\", \"bold\": true, \"italic\": false, \"style\": {\"fontWeight\": 700}}, {\"text\": \" Avoids unnecessary license spend and restores headroom to onboard new active users without a forced purchase.\", \"bold\": false, \"italic\": false, \"style\": {\"fontWeight\": 400}}]}]}, {\"title\": \"Apex Code Quality\", \"bullets\": [{\"runs\": [{\"text\": \"Today:\", \"bold\": true, \"italic\": false, \"style\": {\"fontWeight\": 700}}, {\"text\": \" 507 High-severity and 951 Medium-severity static-analysis violations across the codebase\", \"bold\": false, \"italic\": false, \"style\": {\"fontWeight\": 400}}]}, {\"runs\": [{\"text\": \"Target:\", \"bold\": true, \"italic\": false, \"style\": {\"fontWeight\": 700}}, {\"text\": \" Security-category High-severity violations fully remediated; overall violation count trending down release over release\", \"bold\": false, \"italic\": false, \"style\": {\"fontWeight\": 400}}]}, {\"runs\": [{\"text\": \"Why:\", \"bold\": true, \"italic\": false, \"style\": {\"fontWeight\": 700}}, {\"text\": \" Lowers the risk of exploitable or fragile code shipping to production and makes ongoing development safer and faster.\", \"bold\": false, \"italic\": false, \"style\": {\"fontWeight\": 400}}]}]}], \"decisionsInfo\": \"Every pillar scoring Fair or below gets a card here -- no fixed count. Ordered worst-scoring pillar first; a tie is broken toward whichever fix carries the higher risk if left unaddressed (e.g. unauthorized-access exposure) over one that's purely recoverable spend.\"}<\u002Fscript>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{&quot;scorecardViz&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;bars&quot;,&quot;tiles&quot;],&quot;default&quot;:&quot;bars&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Scorecard&quot;}}\">\nclass Component extends DCLogic {\n  state = { tab: 0, viz: null, sevMode: false, sevTab: 0, sevPillar: 0, modal: null };\n\n  \u002F\u002F ============================================================\n  \u002F\u002F CLIENT DATA — swap this object to reuse the template\n  \u002F\u002F ============================================================\n  data() {\n    return JSON.parse(document.getElementById('report-data').textContent);\n  }\n\n  tone(score) {\n    if (score >= 70) return 'good';\n    if (score >= 50) return 'warn';\n    return 'bad';\n  }\n\n  goPillar(i) {\n    this.setState({ tab: i });\n    const el = document.getElementById('pillars');\n    if (el) {\n      const y = el.getBoundingClientRect().top + window.scrollY - 64;\n      window.scrollTo({ top: y, behavior: 'smooth' });\n    }\n  }\n\n  scrollDecisions(dir) {\n    const el = document.getElementById('decisions-track');\n    if (el) el.scrollBy({ left: dir * el.clientWidth, behavior: 'smooth' });\n  }\n\n  toggleSevMode() {\n    this.setState({ sevMode: !this.state.sevMode, sevTab: 0, sevPillar: 0 });\n  }\n\n  setSevTab(i) {\n    this.setState({ sevTab: i, sevPillar: 0 });\n  }\n\n  setSevPillar(i) {\n    this.setState({ sevPillar: i });\n  }\n\n  openModal(title, items) {\n    this.setState({ modal: { title, items } });\n  }\n\n  closeModal() {\n    this.setState({ modal: null });\n  }\n\n  renderVals() {\n    const D = this.data();\n    const PILLAR_COUNT_WORDS = ['Zero', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten'];\n    const pillarCountWord = PILLAR_COUNT_WORDS[D.pillars.length] || String(D.pillars.length);\n    \u002F\u002F Status colors carried over from the source audit template (NTO palette companions)\n    const C = { good: '#159447', warn: '#D97800', bad: '#D9122F', info: '#33139f', muted: '#6b7280' };\n    const BG = { good: 'rgba(21, 148, 71, 0.1)', warn: 'rgba(217, 120, 0, 0.1)', bad: 'rgba(217, 18, 47, 0.1)', info: 'rgba(133, 62, 255, 0.12)' };\n    const viz = this.state.viz ?? (this.props.scorecardViz ?? 'bars');\n\n    const vizBtn = (on) => ({\n      display: 'inline-flex', alignItems: 'center', gap: 8,\n      padding: '8px 18px', borderRadius: 4, cursor: 'pointer',\n      fontSize: 13, fontWeight: 600, transition: 'all 250ms ease',\n      border: on ? '1px solid #33139f' : '1px solid #e2e4e9',\n      background: on ? '#33139f' : 'transparent',\n      color: on ? '#ffffff' : '#0b111c',\n    });\n\n    const SEVERITIES = ['Critical', 'High', 'Medium', 'Low'];\n    const SEV_COLORS = { Critical: C.bad, High: C.warn, Medium: '#E8A33D', Low: C.muted };\n\n    \u002F\u002F Global severity donut (Findings by Severity story card) -- reuses the same SEVERITIES\u002F\n    \u002F\u002F SEV_COLORS convention as each pillar's own severity dots for full visual consistency.\n    const globalSevCounts = SEVERITIES.map((label) => {\n      const count = (D.counts && D.counts[label.toLowerCase()]) || 0;\n      return { label, count, countLabel: String(count).padStart(2, '0'), color: SEV_COLORS[label] };\n    });\n    const severityTotal = globalSevCounts.reduce((sum, s) => sum + s.count, 0);\n    let _sevAcc = 0;\n    const donutStops = globalSevCounts.map((s) => {\n      const pct = severityTotal ? (s.count \u002F severityTotal * 100) : 0;\n      const stop = s.color + ' ' + _sevAcc.toFixed(2) + '% ' + (_sevAcc + pct).toFixed(2) + '%';\n      _sevAcc += pct;\n      return stop;\n    });\n    const severityDonutStyle = {\n      width: 200, height: 200, borderRadius: '50%', flexShrink: 0, position: 'relative',\n      background: severityTotal ? ('conic-gradient(' + donutStops.join(', ') + ')') : '#e2e4e9',\n    };\n\n    const PREVIEW_COUNT = 5;\n    const pillars = D.pillars.map((p, i) => {\n      const color = C[this.tone(p.score)];\n      const isActive = i === this.state.tab;\n      const allActions = p.actions || [];\n      const preview = allActions.slice(0, PREVIEW_COUNT);\n      const overflow = allActions.slice(PREVIEW_COUNT);\n      const leftCount = Math.ceil(preview.length \u002F 2);\n      \u002F\u002F Findings that never deducted any points (see Finding.scored in scorer.py) -- kept in\n      \u002F\u002F their own list so a pillar scoring 100 doesn't show \"Priority Actions\" implying\n      \u002F\u002F unresolved, score-affecting work when nothing here actually moved the score.\n      const fyiActions = p.fyiActions || [];\n      const sevCounts = SEVERITIES.map((label) => {\n        const count = (p.severityCounts && p.severityCounts[label.toLowerCase()]) || 0;\n        return { label, count, countLabel: String(count).padStart(2, '0'), color: SEV_COLORS[label] };\n      });\n      return Object.assign({}, p, {\n        i, color,\n        num: String(i + 1).padStart(2, '0'),\n        dash: ((p.score \u002F 100) * 326.7).toFixed(1) + ' 326.7',\n        fillStyle: { position: 'absolute', left: 0, top: 0, bottom: 0, width: p.score + '%', background: color, borderRadius: 4, display: 'block' },\n        tabStyle: {\n          padding: '10px 20px', borderRadius: 4, cursor: 'pointer',\n          fontSize: 14, fontWeight: 600, transition: 'all 250ms ease',\n          border: isActive ? '1px solid #33139f' : '1px solid #e2e4e9',\n          background: isActive ? '#33139f' : '#ffffff',\n          color: isActive ? '#ffffff' : '#0b111c',\n        },\n        pick: () => this.setState({ tab: i }),\n        select: () => this.goPillar(i),\n        actionsLeft: preview.slice(0, leftCount),\n        actionsRight: preview.slice(leftCount),\n        hasMoreActions: overflow.length > 0,\n        showAllActions: () => this.openModal('Remaining Actions · ' + p.name, overflow),\n        fyiActions,\n        hasFyiActions: fyiActions.length > 0,\n        sevCounts,\n      });\n    });\n\n    const active = pillars[this.state.tab] || pillars[0];\n\n    const sevTabBtn = (on) => ({\n      padding: '10px 20px', borderRadius: 4, cursor: 'pointer',\n      fontSize: 14, fontWeight: 600, transition: 'all 250ms ease',\n      border: on ? '1px solid #33139f' : '1px solid #e2e4e9',\n      background: on ? '#33139f' : '#ffffff',\n      color: on ? '#ffffff' : '#0b111c',\n    });\n    const sevTabs = SEVERITIES.map((label, i) => {\n      const count = (D.counts && D.counts[label.toLowerCase()]) || 0;\n      return {\n        label, i, count,\n        countLabel: String(count).padStart(2, '0'),\n        tabStyle: sevTabBtn(i === this.state.sevTab),\n        pick: () => this.setSevTab(i),\n      };\n    });\n    const activeSevTab = sevTabs[this.state.sevTab] || sevTabs[0];\n\n    const sevPillars = pillars.map((p, i) => {\n      const isNavActive = i === this.state.sevPillar;\n      const count = (p.severityCounts && p.severityCounts[activeSevTab.label.toLowerCase()]) || 0;\n      const matchSource = (D.allFindings && D.allFindings.length ? D.allFindings : D.risks) || [];\n      const matches = matchSource.filter((r) => r.pillar === p.name && r.sev === activeSevTab.label);\n      return {\n        i, name: p.name,\n        countLabel: String(count).padStart(2, '0'),\n        navStyle: {\n          display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,\n          width: '100%', textAlign: 'left', border: 'none',\n          padding: '12px 16px', borderRadius: 4, cursor: 'pointer',\n          fontSize: 14, fontWeight: isNavActive ? 700 : 600, transition: 'all 200ms ease',\n          borderLeft: isNavActive ? '3px solid #33139f' : '3px solid transparent',\n          background: isNavActive ? 'rgba(51, 19, 159, 0.06)' : 'transparent',\n          color: isNavActive ? '#33139f' : '#0b111c',\n        },\n        pickNav: () => this.setSevPillar(i),\n        hasMatches: matches.length > 0,\n        noMatches: matches.length === 0,\n        matchedRisks: matches.map((r, ri) => ({\n          num: String(ri + 1).padStart(2, '0'),\n          title: r.title,\n          evidence: r.evidence,\n          evidenceRuns: r.evidenceRuns,\n          showActions: () => this.openModal('Recommended Actions · ' + p.name, p.actions || []),\n        })),\n      };\n    });\n    const activeSevPillar = sevPillars[this.state.sevPillar] || sevPillars[0];\n\n    return {\n      client: D.client,\n      reportDate: D.reportDate,\n      reportMeta: D.reportMeta,\n      overall: D.overall,\n      overallStatus: D.overallStatus,\n      overallColor: C[this.tone(D.overall)],\n      nCritical: D.counts.critical,\n      nHigh: D.counts.high,\n      nMedium: D.counts.medium,\n      nLow: D.counts.low,\n      verdict: D.verdict,\n      verdictRuns: D.verdictRuns,\n      heroTakeaway: D.heroTakeaway,\n      heroTakeawayRuns: D.heroTakeawayRuns,\n      decisionsInfo: D.decisionsInfo,\n      decisionsCount: D.decisions.length,\n      globalSevCounts,\n      severityTotal,\n      severityDonutStyle,\n      story: D.story.map((s) => Object.assign({}, s, {\n        color: C[s.tone],\n        bg: BG[s.tone],\n        isAlert: s.icon === 'alert',\n        isSparkle: s.icon !== 'alert',\n      })),\n      pillars,\n      pillarCountWord,\n      active,\n      activeActions: active.actions || [],\n      risks: D.risks.map((r, i) => Object.assign({}, r, {\n        num: String(i + 1).padStart(2, '0'),\n        color: r.sev === 'Critical' ? C.bad : (r.sev === 'High' ? C.warn : C.muted),\n      })),\n      decisions: D.decisions.map((d, i) => Object.assign({}, d, { num: String(i + 1).padStart(2, '0') })),\n      vizBars: viz === 'bars',\n      vizTiles: viz === 'tiles',\n      vbStyle: vizBtn(viz === 'bars'),\n      vtStyle: vizBtn(viz === 'tiles'),\n      setBars: () => this.setState({ viz: 'bars' }),\n      setTiles: () => this.setState({ viz: 'tiles' }),\n      decisionsPrev: () => this.scrollDecisions(-1),\n      decisionsNext: () => this.scrollDecisions(1),\n      sevMode: this.state.sevMode,\n      pillarMode: !this.state.sevMode,\n      toggleSevMode: () => this.toggleSevMode(),\n      byPillarLabelStyle: {\n        fontSize: 15, transition: 'all 200ms ease',\n        fontWeight: this.state.sevMode ? 600 : 700,\n        color: this.state.sevMode ? '#9ca3af' : '#0b111c',\n      },\n      bySeverityLabelStyle: {\n        fontSize: 15, transition: 'all 200ms ease',\n        fontWeight: this.state.sevMode ? 700 : 600,\n        color: this.state.sevMode ? '#0b111c' : '#9ca3af',\n      },\n      sevSwitchTrackStyle: {\n        position: 'relative', display: 'inline-block', width: 44, height: 24,\n        borderRadius: 999, flexShrink: 0, transition: 'background 200ms ease',\n        background: this.state.sevMode ? '#33139f' : '#e2e4e9',\n      },\n      sevSwitchKnobStyle: {\n        position: 'absolute', top: 2, left: this.state.sevMode ? 22 : 2,\n        width: 20, height: 20, borderRadius: '50%', background: '#ffffff',\n        boxShadow: '0 1px 3px rgba(0, 0, 0, 0.25)', transition: 'left 200ms ease',\n      },\n      sevTabs,\n      activeSevTab,\n      sevPillars,\n      activeSevPillar,\n      modalOpen: !!this.state.modal,\n      modalTitle: this.state.modal ? this.state.modal.title : '',\n      modalItems: this.state.modal ? this.state.modal.items : [],\n      closeModal: () => this.closeModal(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
